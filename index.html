<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMNITRIX // PROTOTYPE ARCHIVE [DAMAGED UNIT]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0c1216] text-white select-none">
    <div id="root">
      <div style="color: #88ff00; font-family: monospace; padding: 24px;">Initializing Omnitrix Core...</div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL_ERROR_CAUGHT:', e.message, e.filename, e.lineno);
        var errDiv = document.getElementById('debug-error-banner');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error-banner';
          errDiv.style = 'position:fixed;bottom:0;left:0;right:0;background:rgba(220,38,38,0.95);color:white;padding:16px;z-index:99999;font-family:monospace;font-size:12px;white-space:pre-wrap;';
          document.body.appendChild(errDiv);
        }
        errDiv.textContent = 'RUNTIME ERROR: ' + e.message + '\nAT: ' + e.filename + ':' + e.lineno;
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
